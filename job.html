<!DOCTYPE html>
<html>
<head>
  <title>Job Details | Assistlana</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-100 via-white to-blue-100">

<!-- HEADER -->
<header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">

    <!-- Logo (Left) -->
    <div class="flex items-center gap-2">
      <img src="logo.png" class="h-10">
      <span class="font-bold text-xl">Assistlana</span>
    </div>

    <!-- Center Navigation -->
    <nav class="hidden md:flex gap-10 text-slate-700 font-semibold absolute left-1/2 transform -translate-x-1/2">
      <a href="assistlana.html" class="hover:text-blue-600 transition">
        Browse Jobs
      </a>
      <a href="growth-path.html" class="hover:text-blue-600 transition">
        Growth Path
      </a>
      <a href="Quick.html" class="hover:text-blue-600 transition">
        Quick Learn
      </a>
    </nav>

    <!-- Menu Button (Right) -->
    <div class="relative">
      <button id="menuBtn"
        class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg shadow transition">
        Menu
      </button>

      <div id="menuDropdown"
           class="hidden absolute right-0 mt-3 w-48 bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
        <a href="assistlana.html" class="block px-4 py-3 hover:bg-slate-100">
          Browse Jobs
        </a>
        <a href="growth-path.html" class="block px-4 py-3 hover:bg-slate-100">
          Growth Path
        </a>
        <a href="Quick.html" class="block px-4 py-3 hover:bg-slate-100">
          Quick Learn
        </a>
      </div>
    </div>

  </div>
</header>

<!-- RECENT JOBS SLIDER -->
<div class="px-6 py-12">
  <h2 class="text-3xl font-bold mb-8 text-slate-800 text-center">
     Recent Opportunities
  </h2>

  <div class="relative max-w-6xl mx-auto overflow-hidden">
    <div id="slider" class="flex transition-transform duration-500 ease-in-out"></div>

    <button id="prevBtn"
      class="absolute left-0 top-1/2 -translate-y-1/2 bg-white shadow-lg hover:scale-110 transition p-3 rounded-full">
      ◀
    </button>

    <button id="nextBtn"
      class="absolute right-0 top-1/2 -translate-y-1/2 bg-white shadow-lg hover:scale-110 transition p-3 rounded-full">
      ▶
    </button>
  </div>
</div>

<!-- MAIN CONTENT -->
<main class="relative z-10 px-4 md:px-8 pb-20">
  <div class="mx-auto w-full max-w-6xl bg-white rounded-2xl shadow-2xl overflow-hidden">

    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-10 py-12">
      <h1 id="job-title" class="text-3xl font-bold">Loading...</h1>
      <p id="job-company" class="opacity-90 mt-2 text-lg"></p>
    </div>

    <div class="p-10 space-y-8">
      <div id="job-description" class="text-slate-700 leading-8 text-lg"></div>
      <div class="text-2xl font-bold text-slate-900" id="job-salary"></div>

      <a id="job-link" target="_blank"
        class="inline-flex bg-blue-600 hover:bg-blue-700 transition text-white px-8 py-3 rounded-xl font-semibold shadow-lg">
        Apply Now →
      </a>
    </div>

  </div>
</main>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs,
  query,
  limit
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "jobboard-b6192.firebaseapp.com",
  projectId: "jobboard-b6192"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const slider = document.getElementById("slider");
let currentIndex = 0;

/* LOAD RECENT JOBS */
async function loadRecentJobs() {
  const q = query(collection(db, "jobs"), limit(6));
  const snapshot = await getDocs(q);

  snapshot.forEach((jobDoc) => {
    const data = jobDoc.data();

    const card = document.createElement("div");
    card.className = "min-w-full md:min-w-[33.33%] p-5";

    card.innerHTML = `
      <div class="bg-white rounded-2xl shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 cursor-pointer overflow-hidden h-full border border-slate-100">
        <div class="bg-gradient-to-r from-blue-500 to-indigo-500 h-2"></div>
        <div class="p-6">
          <h3 class="font-semibold text-xl text-slate-800 mb-3">
            ${data.title || "Untitled Job"}
          </h3>
          <p class="text-slate-500 text-sm mb-4">
            ${data.company || ""}
          </p>
          <div class="text-blue-600 font-semibold">
            ${data.salaryText || "View Details"}
          </div>
        </div>
      </div>
    `;

    card.onclick = () => {
      window.location.href = "job.html?id=" + jobDoc.id;
    };

    slider.appendChild(card);
  });
}

loadRecentJobs();

/* SLIDER LOGIC */
function updateSlide() {
  slider.style.transform = `translateX(-${currentIndex * 100}%)`;
}

document.getElementById("nextBtn").onclick = () => {
  if (currentIndex < slider.children.length - 1) currentIndex++;
  updateSlide();
};

document.getElementById("prevBtn").onclick = () => {
  if (currentIndex > 0) currentIndex--;
  updateSlide();
};

/* LOAD SELECTED JOB */
const params = new URLSearchParams(window.location.search);
const jobId = params.get("id");

if (jobId) {
  const snap = await getDoc(doc(db, "jobs", jobId));
  if (snap.exists()) {
    const job = snap.data();
    document.getElementById("job-title").textContent = job.title || "";
    document.getElementById("job-company").textContent = job.company || "";
    document.getElementById("job-description").innerHTML = job.description || "";
    document.getElementById("job-salary").textContent =
      job.salaryText || "As Per Industry Standards";
    document.getElementById("job-link").href = job.link || "#";
  }
}
</script>

<script>
const menuBtn = document.getElementById("menuBtn");
const menuDropdown = document.getElementById("menuDropdown");

menuBtn.addEventListener("click", () => {
  menuDropdown.classList.toggle("hidden");
});

document.addEventListener("click", (e) => {
  if (!menuBtn.contains(e.target) && !menuDropdown.contains(e.target)) {
    menuDropdown.classList.add("hidden");
  }
});
</script>

</body>
</html>
